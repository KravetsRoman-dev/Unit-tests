name: Unit Tests

on:
  push:

jobs:
  tests:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Show project structure
        shell: bash
        run: |
          pwd
          ls -R

      - name: Run unit tests
        run: python Unit-test/unit-test/test.py